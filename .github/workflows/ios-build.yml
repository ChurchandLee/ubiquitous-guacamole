name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: "HeartoListen"
  BUNDLE_ID: "com.yourcompany.heartolisten"

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Dependencies
      run: |
        npm install -g cordova@latest
        npm install -g ios-deploy
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Import Certificate and Provisioning Profile
      env:
        IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      run: |
        # Create temporary keychain
        security create-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        
        # Import certificate
        echo $IOS_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P $IOS_CERTIFICATE_PASSWORD -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
        
        # Import provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo $IOS_PROVISIONING_PROFILE | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
        
    - name: Prepare Cordova iOS Platform
      run: |
        # Copy web files to www directory
        mkdir -p www
        cp index.html www/ || echo "index.html not found"
        cp manifest.json www/ || echo "manifest.json not found"
        cp -r icons www/ || echo "icons directory not found"
        cp -r css www/ || echo "css directory not found" 
        cp -r js www/ || echo "js directory not found"
        cp *.png www/ || echo "png files not found"
        
        # Add iOS platform
        cordova platform add ios
        
    - name: Build iOS App
      run: |
        cordova build ios --release --device
        
    - name: Archive for App Store
      run: |
        cd platforms/ios
        xcodebuild -workspace $APP_NAME.xcworkspace \
                   -scheme $APP_NAME \
                   -configuration Release \
                   -destination generic/platform=iOS \
                   -archivePath $APP_NAME.xcarchive \
                   archive
                   
    - name: Export IPA
      env:
        EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
      run: |
        cd platforms/ios
        echo $EXPORT_OPTIONS_PLIST | base64 --decode > ExportOptions.plist
        xcodebuild -exportArchive \
                   -archivePath $APP_NAME.xcarchive \
                   -exportPath . \
                   -exportOptionsPlist ExportOptions.plist
                   
    - name: Upload to App Store Connect
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      run: |
        cd platforms/ios
        xcrun altool --upload-app \
                     --type ios \
                     --file $APP_NAME.ipa \
                     --apiKey $APP_STORE_CONNECT_KEY_ID \
                     --apiIssuer $APP_STORE_CONNECT_ISSUER_ID
                     
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: platforms/ios/*.ipa
